<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: Display;
  src: url('/fonts/BricolageGrotesque.ttf');
  font-weight: 200 800;
}
@font-face {
  font-family: Body;
  src: url('/fonts/DMSans.ttf');
  font-weight: 100 1000;
}
html, body {
  margin: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #073344;
}
canvas {
  display: block;
}
#caption {
  position: absolute;
  left: 96px;
  top: 76px;
  color: #f4edda;
  font: 750 52px Display;
  letter-spacing: -0.015em;
  max-width: 1040px;
  text-shadow: 0 2px 0 #052938;
  line-height: 1.08;
}
#detail {
  display: block;
  color: #d7e6e8;
  font: 450 24px Body;
  letter-spacing: 0.005em;
  margin-top: 10px;
  text-shadow: 0 1px 0 #052938;
}
#badge {
  position: absolute;
  right: 96px;
  top: 84px;
  color: #dfb565;
  font: 700 26px Display;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-shadow: 0 2px 0 #052938;
}
</style>
</head>
<body>
<div id="caption"></div>
<div id="badge"></div>
<script type="module" src="/bundle3d.js"></script>

</html>
