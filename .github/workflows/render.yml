name: render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        default: "Film"
        required: true
      concurrency:
        description: "Remotion concurrency"
        default: "4"
        required: false
      frame:
        description: "still frame"
        default: "80"
        required: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Shot budget + anti-repetition
        run: python3 scripts/shot_lint.py
      - name: Sources
        run: python3 scripts/check_sources.py
      - name: Sync guards
        run: python3 scripts/check_sync.py

  render:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu libgbm1
          ffmpeg -version | head -1
      - run: npm ci
      - name: Probe machine
        run: python3 scripts/render_probe.py
      - name: Render still (fast visual check)
        run: npx remotion still src/index.ts "${{ inputs.composition }}" out/still.png --frame=${{ inputs.frame }} --gl=swangle
      - name: Render video
        run: |
          npx remotion render src/index.ts "${{ inputs.composition }}" out/video.mp4 \
            --gl=swangle --concurrency=${{ inputs.concurrency }} --crf=18 \
            --pixel-format=yuv420p
      - name: Loudness/encode sanity (only if audio exists)
        run: |
          if ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 out/video.mp4 | grep -q audio; then
            ffmpeg -y -i out/video.mp4 -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k out/video_norm.mp4
            mv out/video_norm.mp4 out/video.mp4
          else
            echo "no audio stream yet (audio stage is gated)"
          fi
      - name: Probe output
        run: ffprobe -v error -show_entries stream=width,height,r_frame_rate,pix_fmt,nb_frames -show_entries format=duration,size -of default=nw=1 out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.composition }}
          path: |
            out/video.mp4
            out/still.png
          retention-days: 14
