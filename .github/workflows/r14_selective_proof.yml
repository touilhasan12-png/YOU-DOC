name: R14 — selective shark, 2D and wet-shore proof
on:
  push:
    branches: [r14-selective-refinement]
    paths: [ENGINE_SOURCE/r14/PROOF_REQUEST.json]
permissions:
  contents: read
jobs:
  corrected-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ENGINE_SOURCE/three_engine/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu24-playwright-1.48.2
      - working-directory: ENGINE_SOURCE/three_engine
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: node ENGINE_SOURCE/r14/render.mjs proof
      - run: |
          python -m pip install pillow==11.3.0
          python ENGINE_SOURCE/r14/proof_sheets.py
      - uses: actions/upload-artifact@v4
        with:
          name: r14-selective-proof
          path: R14_PROOF/
          retention-days: 14
