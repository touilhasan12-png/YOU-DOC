name: Reconstruct image-derived 3D depth mesh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference and 3D tools
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow numpy trimesh scipy
      - name: Estimate depth and generate textured mesh
        run: python tools/image_to_3d.py
      - uses: actions/upload-artifact@v4
        with:
          name: image-derived-hangar-3d
          path: cloud_reconstruction/
          if-no-files-found: error
