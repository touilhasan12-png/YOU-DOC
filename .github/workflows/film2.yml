name: film2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'stills | film | both'
        default: 'both'

jobs:
  film2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - name: Chromium system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 ffmpeg || \
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2 ffmpeg
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Stills at the cuts
        run: |
          mkdir -p out
          for FR in 45 105 165 230 295 355 420 480 560 660 740 840 900 990 1080 1170 1245 1330 1420 1500 1590 1670 1750 1850 1950; do
            npx remotion still src/index.ts Film2 out/f2_${FR}.png --frame=${FR} --gl=swangle
          done
      - name: Tilt clip, 3.7 s, straight through two cuts
        run: npx remotion render src/index.ts Film2 out/f2_clip.mp4 --gl=swangle --crf=20 --frames=249-359 --muted
      - name: The film
        if: ${{ github.event.inputs.mode != 'stills' }}
        run: npx remotion render src/index.ts Film2 out/The_Locked_Countries_v2.mp4 --gl=swangle --concurrency=4 --crf=18 --audio-bitrate=160k
      - name: Small copy for the phone
        if: ${{ github.event.inputs.mode != 'stills' }}
        run: ffmpeg -y -loglevel error -i out/The_Locked_Countries_v2.mp4 -vf "scale=720:-2" -c:v libx264 -crf 26 -pix_fmt yuv420p -c:a aac -b:a 96k out/small.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: film2
          path: |
            out/f2_*.png
            out/f2_clip.mp4
            out/The_Locked_Countries_v2.mp4
            out/small.mp4
          retention-days: 14
