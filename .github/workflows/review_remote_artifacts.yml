name: Review sheets from existing remote proof artifacts
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing documentary proof run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  review-sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==10.4.0 av==13.1.0 numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-proof-*
          merge-multiple: true
          path: REMOTE_PROOFS
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: python ENGINE_SOURCE/production/remote_review_sheets.py
      - uses: actions/upload-artifact@v4
        with:
          name: remote-review-sheets
          path: REMOTE_REVIEW/
          retention-days: 30
