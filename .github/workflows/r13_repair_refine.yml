name: R13 — final framing and visible learning calf
on:
  push:
    branches: [r13-repaired-action]
    paths: [ENGINE_SOURCE/r13/REFINEMENT_REQUEST.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: r13-final-refinement
  cancel-in-progress: false
jobs:
  new-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ENGINE_SOURCE/three_engine/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu24-playwright-1.48.2
      - name: Install pinned rendering runtime
        working-directory: ENGINE_SOURCE/three_engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: r13-animation-*
          merge-multiple: true
          path: R13_UNITS
          run-id: 42475324554
          github-token: ${{ github.token }}
      - name: Refine only opening framing and learning calf
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          export FFMPEG_EXE="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          node ENGINE_SOURCE/r13/render.mjs refine 99
          python -m pip install requests==2.32.3 pillow==11.3.0
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python ENGINE_SOURCE/r13/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: r13-original-audio-complete-film
          path: R13_DELIVERY/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r13-final-picture-review
          path: R13_FINAL_REVIEW/
          if-no-files-found: error
          retention-days: 14
