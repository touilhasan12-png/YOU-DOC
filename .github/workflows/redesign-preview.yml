name: Render visual redesign preview (cloud)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/render_redesign.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-preview-video
          path: cloud_preview/
          if-no-files-found: error
