name: R5 — new visual system internal evaluation
on:
  push:
    branches: [r5-full-film-rebuild]
    paths: [ENGINE_SOURCE/r5/production/LOOKDEV_REQUEST.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: r5-look-development
  cancel-in-progress: false
jobs:
  visual-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Validate all-new-picture scope, exact original script and timeline
        run: python ENGINE_SOURCE/r5/production/validate_blueprint.py
      - uses: actions/download-artifact@v4
        with:
          name: r5-authored-human-conversion
          path: ENGINE_SOURCE/r5/production_assets
          run-id: 42288645035
          github-token: ${{ github.token }}
      - name: Check exact converted source and retain conversion record
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('ENGINE_SOURCE/r5/production_assets');r=json.loads((p/'SNOW_CONVERSION.json').read_text())
          assert hashlib.sha256((p/'snow_clean.glb').read_bytes()).hexdigest()==r['sha256']
          assert r['bone_count']==60 and r['autoexec_enabled'] is False
          assert all(m['fallback_vertices']==0 for m in r['meshes'] if m['mesh'] in ['GEO-snow-body','GEO-snow-shirt','GEO-snow-pants','GEO-snow-head'])
          Path('R5_LOOKDEV').mkdir(exist_ok=True)
          Path('R5_LOOKDEV/SNOW_CONVERSION.json').write_text(json.dumps(r,indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ENGINE_SOURCE/three_engine/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu24-playwright-1.48.2
      - name: Install pinned WebGL runtime and Chromium
        timeout-minutes: 8
        working-directory: ENGINE_SOURCE/three_engine
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Render eight full-size frames of newly authored cast, boat, sea and animal
        run: node ENGINE_SOURCE/r5/production/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-internal-visual-system
          path: R5_LOOKDEV/
          retention-days: 30
          if-no-files-found: error
