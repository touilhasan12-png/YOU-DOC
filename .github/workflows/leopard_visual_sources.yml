name: Leopard visual rebuild — inspect real videos and four real photos
on:
  push:
    paths:
      - '.github/workflows/leopard_visual_sources.yml'
      - 'LEOPARD_SEAL/visual_rebuild/inspect_real_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-real-camera-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned media-inspection tools
        run: python -m pip install imageio-ffmpeg==0.6.0 pillow==11.3.0
      - name: Fully decode four real videos, extract actual source frames, inspect exactly four real stills
        run: python LEOPARD_SEAL/visual_rebuild/inspect_real_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leopard-real-source-inspection
          path: LEOPARD_SEAL/generated/real-source-inspection/
          retention-days: 30
