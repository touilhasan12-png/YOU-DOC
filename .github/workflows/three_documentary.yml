name: Genuine Three.js articulated scene rebuild — GitHub only
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Private full-motion proof or complete film assembly
        required: true
        default: proof
        type: choice
        options: [proof, native]
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  actual-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ENGINE_SOURCE/requirements.txt
      - run: pip install -r ENGINE_SOURCE/requirements.txt
      - name: Install actual Three.js, BVH intersection library and Chromium
        working-directory: ENGINE_SOURCE/three_engine
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run bundle
      - name: Genuine WebGL articulation, mesh contacts and continuous video
        run: python ENGINE_SOURCE/production/three_native.py ${{ inputs.mode }} --shard ${{ matrix.shard }} --shards 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-${{ inputs.mode }}-${{ matrix.shard }}
          path: |
            ENGINE_SOURCE/picture_units/
            ENGINE_SOURCE/qa/unit_receipts/
            ENGINE_SOURCE/qa/three/
            ENGINE_SOURCE/three_engine/package-lock.json
          retention-days: 30
  complete-film:
    if: inputs.mode == 'native'
    needs: actual-webgl
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ENGINE_SOURCE/requirements.txt
      - run: pip install -r ENGINE_SOURCE/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: ENGINE_SOURCE
          run-id: 42251241326
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: retouched-hardware-*
          merge-multiple: true
          path: ENGINE_SOURCE
          run-id: 42256029752
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: narration-and-geometry
          path: ENGINE_SOURCE
          run-id: 42251241326
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: three-native-*
          merge-multiple: true
          path: ENGINE_SOURCE
      - name: Strict current-source verification of all 93 units and complete decode
        run: python ENGINE_SOURCE/production/ci_pipeline.py candidate
      - name: Independent audio payload and full duration audit
        run: |
          ln -s "$PWD/ENGINE_SOURCE/delivery" CANDIDATE
          mkdir SOURCE_AUDIO
          ln -s "$PWD/ENGINE_SOURCE/audio_revision_ending" SOURCE_AUDIO/audio_revision_ending
          python ENGINE_SOURCE/production/audit_existing_movie.py
          cp REMOTE_FINAL_AUDIT/FINAL_TECHNICAL_AUDIT.json ENGINE_SOURCE/delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: three-revision-complete-film-and-native-review
          path: ENGINE_SOURCE/delivery/
          retention-days: 30
