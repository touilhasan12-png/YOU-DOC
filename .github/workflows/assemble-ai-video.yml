name: Assemble AI image video
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch AI-generated images from previous run
        uses: actions/download-artifact@v4
        with:
          name: actual-ai-images-test
          path: ai_images
          run-id: 42105101551
          github-token: ${{ github.token }}
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Create 15-second 15fps video
        shell: bash
        run: |
          set -euo pipefail
          mkdir output
          ls -lah ai_images
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 15 -t 3.8 -i ai_images/frame_0001.png \
            -loop 1 -framerate 15 -t 3.8 -i ai_images/frame_0002.png \
            -loop 1 -framerate 15 -t 3.8 -i ai_images/frame_0003.png \
            -loop 1 -framerate 15 -t 3.8 -i ai_images/frame_0004.png \
            -loop 1 -framerate 15 -t 3.8 -i ai_images/frame_0005.png \
            -filter_complex "[0:v]format=yuv420p,settb=AVTB[v0];[1:v]format=yuv420p,settb=AVTB[v1];[2:v]format=yuv420p,settb=AVTB[v2];[3:v]format=yuv420p,settb=AVTB[v3];[4:v]format=yuv420p,settb=AVTB[v4];[v0][v1]xfade=transition=fade:duration=1:offset=2.8[a];[a][v2]xfade=transition=fade:duration=1:offset=5.6[b];[b][v3]xfade=transition=fade:duration=1:offset=8.4[c];[c][v4]xfade=transition=fade:duration=1:offset=11.2[out]" \
            -map "[out]" -frames:v 225 -r 15 -c:v libx264 -pix_fmt yuv420p -movflags +faststart output/fox_star.mp4
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=r_frame_rate,nb_read_frames,duration -of default=nw=1 output/fox_star.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ai-fox-video
          path: output/fox_star.mp4
          retention-days: 7
