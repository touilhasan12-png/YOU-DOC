name: Render 2D short with Manim
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cairo and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu
          python -m pip install 'manim==0.19.0'
      - name: Render 15 seconds at 15 fps
        run: |
          manim --renderer cairo -r 854,480 --fps 15 --disable_caching animation/little_star.py LittleStar
          mkdir -p output/frames
          cp media/videos/little_star/480p15/LittleStar.mp4 output/LittleStar.mp4
          ffmpeg -v error -i output/LittleStar.mp4 -vsync 0 output/frames/frame_%04d.png
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,r_frame_rate,nb_read_frames -of default=nw=1 output/LittleStar.mp4
          test "$(find output/frames -name '*.png' | wc -l)" -eq 225
      - uses: actions/upload-artifact@v4
        with:
          name: little-star-video-and-frames
          path: output/
          retention-days: 7
