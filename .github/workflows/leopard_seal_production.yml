name: Leopard seal — exact-script production and model QA
on:
  push:
    paths:
      - 'LEOPARD_SEAL/**'
      - '.github/workflows/leopard_seal_production.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: leopard-seal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shot: [underice, profile, jaw, diver]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/PRODUCTION_KIT/vendor/browsers
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore bundled runtime and approved human source
        working-directory: PRODUCTION_KIT
        run: |
          python scripts/rehydrate.py
          python -m pip install --no-index --find-links vendor/wheels imageio-ffmpeg==0.6.0 pillow==11.3.0
      - name: Install pinned JS and browser system libraries
        working-directory: PRODUCTION_KIT/runtime
        run: |
          npm ci --offline --ignore-scripts --cache ../vendor/npm-cache --no-audit --no-fund
          npx playwright install-deps chromium
      - name: Render and encode actual new seal action at 1080p24
        run: |
          export FFMPEG_EXE="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          node LEOPARD_SEAL/scripts/render_proof.mjs ${{ matrix.shot }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leopard-visual-${{ matrix.shot }}
          path: LEOPARD_SEAL/generated/${{ matrix.shot }}/
          retention-days: 30
          if-no-files-found: warn
  narration-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech verification toolchain only
        run: python -m pip install faster-whisper==1.2.1
      - name: Audit exact narration without rewriting or hiding missing audio
        run: python LEOPARD_SEAL/scripts/audio_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leopard-narration-audit
          path: LEOPARD_SEAL/generated/audio-audit/
          retention-days: 30
