name: R5 — all new native pictures, never old units
on:
  push:
    branches: [r5-full-film-rebuild]
    paths: [ENGINE_SOURCE/r5/production/NATIVE_RENDER_REQUEST.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: r5-native-new-pictures
  cancel-in-progress: false
jobs:
  continuous-motion-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/r5-runtime
      - name: Check every frame of critical actions before six native shards may begin
        run: node ENGINE_SOURCE/r5/production/render_native.mjs preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-continuous-motion-preflight
          path: R5_MOTION_PREFLIGHT/
          retention-days: 30
  new-native-pictures:
    needs: continuous-motion-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/r5-runtime
      - name: Restore pinned FFmpeg encoder
        run: |
          python -m pip install imageio-ffmpeg==0.6.0 av==13.1.0 Pillow==10.4.0
          echo "FFMPEG_EXE=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Render every allocated frame from current R5 sources
        run: node ENGINE_SOURCE/r5/production/render_native.mjs native ${{ matrix.shard }} 6
      - name: Decode every new native frame and derive encoded review samples
        run: python ENGINE_SOURCE/r5/production/review_native.py R5_NATIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-new-native-${{ matrix.shard }}
          path: R5_NATIVE/
          retention-days: 30
