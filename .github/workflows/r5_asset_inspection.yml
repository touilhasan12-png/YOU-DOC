name: R5 — bounded licensed-source inspection (not a film render)
on:
  push:
    branches: [r5-full-film-rebuild]
    paths: [ENGINE_SOURCE/r5/production/INSPECTION_REQUEST.json]
permissions:
  contents: read
concurrency:
  group: r5-source-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Reject an unauthorized/incorrect request and verify canonical material
        run: python ENGINE_SOURCE/r5/production/validate_blueprint.py
      - name: Retrieve unchanged licensed source and exact pinned Blender distribution
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r5-source"
          cd "$RUNNER_TEMP/r5-source"
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.5-linux-x64.tar.xz -o blender.tar.xz
          echo 'cd28ab8164d88237c0c45a188ef7e4974bcb8c651de15fcbc3635166e584e4b3  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          curl --fail --location --retry 2 https://github.com/touilhasan12-png/YOU-DOC/releases/download/r5-authored-source-archive-20261106/Snow_v4_ORIGINAL.zip -o snow.zip
          echo '98d58ef3a07083ede14140bc462cccb55d317062846aa0eb652d2e4a7ac422a6  snow.zip' | sha256sum -c -
          unzip -q snow.zip -d snow
      - name: Inspect real rig/topology/material/texture metadata with embedded scripts disabled
        run: |
          "$RUNNER_TEMP/r5-source/blender-4.2.5-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 13 --python ENGINE_SOURCE/r5/production/inspect_sources.py -- "$RUNNER_TEMP/r5-source/snow/Snow/snow_v4.2.blend"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-licensed-source-inspection
          path: R5_INSPECTION/
          retention-days: 30
          if-no-files-found: error
